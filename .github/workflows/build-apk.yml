name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Chuan bi keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/xaydungvn-release.jks"
          echo "XD_KEYSTORE_PATH=$RUNNER_TEMP/xaydungvn-release.jks" >> "$GITHUB_ENV"
          echo "XD_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "XD_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "XD_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build APK
        run: flutter build apk --release --no-shrink --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xaydungvnmobi3-apk
          path: build/app/outputs/flutter-apk/*.apk
